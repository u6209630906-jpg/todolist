<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Mie Mini App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            margin-bottom: 30px;
            color: #2c3e50;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }
        .btn {
            display: block;
            text-align: center;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .btn:active {
            transform: translateY(0);
        }
        /* Colore bottone Gunt Day */
        .btn-gunt {
            background-color: #e74c3c;
        }
        /* Colore bottone Todo List */
        .btn-todo {
            background-color: #3498db;
        }
    </style>
</head>
<body>

    <h1>🚀 Le Mie Mini App</h1>

    <div class="container">
        <!-- Bottone per Gunt Day -->
        <a href="gunt-day.html" class="btn btn-gunt">📅 Apri Gunt Day</a>
        
        <!-- Bottone per Todo List -->
        <a href="todolist.html" class="btn btn-todo">✅ Apri Todo List</a>
    </div>

</body>
</html>
